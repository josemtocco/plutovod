name: Atualizar lista M3U

on:
  schedule:
    - cron: "0 */6 * * *"   # de 6 em 6 horas (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    # Se a Pluto ainda devolver "US", use um runner no Brasil: runs-on: self-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes automatizados
        run: npm test

      - name: Coletar catálogo e gerar M3U
        env:
          RESOLVER_BASE_URL: ${{ vars.RESOLVER_BASE_URL }}
          FORWARDED_FOR_IP: ${{ secrets.FORWARDED_FOR_IP }}
        run: npm run build

      - name: Testar reprodução (amostra de links via Worker)
        env:
          RESOLVER_BASE_URL: ${{ vars.RESOLVER_BASE_URL }}
        run: npm run verify -- --sample=30

      - name: Publicar (commit) se passou nos testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist data
          git diff --cached --quiet || git commit -m "chore: atualiza lista ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
